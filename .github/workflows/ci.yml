name: Service tests and Dockerfile lint
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi uvicorn pytest httpx
      - run: |
          for service in merchant greeting pocket; do
            ( cd "services/${service}-api" && pytest -q )
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cd services/link-api && go test ./...
      - run: docker compose config -q
